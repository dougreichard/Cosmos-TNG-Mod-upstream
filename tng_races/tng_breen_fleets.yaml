# Breen raiding fleets, by difficulty.
#
# Eleven tiers, five variants each; a variant is the ship keys making up one
# fleet. Loaded when the DOMINION is in the NPC_RACES setting - the manifest's
# `serves` map says so, because a Breen hull is a Dominion asset and asking a
# mission to name a faction that fields exactly one ship is not reasonable.
#
# THIS FILE IS WHY `serves` EXISTS AND IT WAS MISSING. `theaters.amd` rosters
# `breen:` in dominion_war and orion_syndicate, and `Breen` is a real shipData
# side with its own hull - but with no ladder registered, `fleet_create` printed
# "no fleet table for race 'breen'" and returned None, and the raider prefab then
# died on `brain_add(fleet.id, ...)` with `'NoneType' object has no attribute
# 'id'`. Every Breen roll (4-14% of dominion_war, up to 20% of orion_syndicate)
# was a runtime error instead of a fleet.
#
# ONE HULL, SO THE CURVE IS COUNT AND NOT VARIETY. The Chel Grett is a `heavy,
# loner` - the Dominion ladder uses it as its mid-tier flagship - so this ladder
# climbs slower than a faction whose light hull carries the low tiers. The
# theater depth guard is what keeps a one-hull faction off the heavy slot; it
# does not need this file to be shorter, it needs the shares to stay small,
# which both theaters already do.
race: Breen
fleets:
  # difficulty 0
  -
    - [tng_brn_chel_grett]
    - [tng_brn_chel_grett]
    - [tng_brn_chel_grett]
    - [tng_brn_chel_grett]
    - [tng_brn_chel_grett]
