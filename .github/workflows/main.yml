name: Release
# Push a tag that matches __lib__.json's "version" (e.g. v0.3.0) and this builds the
# release assets `sbs fetch Cosmos-TNG-Mod -u <owner>` downloads:
#   <owner>.Cosmos-TNG-Mod.<addon>.<tag>.mastlib   one per __lib__.json "mastlib" entry
#   <owner>.Cosmos-TNG-Mod.media.<tag>.zip         the shared media pack
# Adapted from LegendaryMissions' workflow.
on:
  push:
    tags:
      - "*"
jobs:
  # The addon list is read straight from __lib__.json, so adding an addon there ships it.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The tag IS the version in every asset name, and the same version is baked into
      # story.json and every artfileroot in media/tng_ships.json. A tag that disagrees
      # publishes assets nothing refers to, so refuse it here instead.
      - name: Tag must equal __lib__.json version
        run: |
          want=$(jq -r '.version' __lib__.json)
          if [ "$want" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match __lib__.json version $want"
            exit 1
          fi
      - name: Build addon matrix from __lib__.json
        id: set
        run: echo "matrix=$(jq -c '.mastlib' __lib__.json)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        item: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      # Exactly what `sbs lib -u <owner>` writes into __lib__ and story.json refers to.
      ASSET: ${{ github.repository_owner }}.${{ github.event.repository.name }}.${{ matrix.item }}.${{ github.ref_name }}.mastlib
    steps:
      - uses: actions/checkout@v4
      # FLAT: MAST reads __init__.mast at the zip ROOT. A nested archive never loads.
      - name: Archive addon (flat, matching `sbs lib`)
        env:
          SRC: ${{ matrix.item }}
        run: python .github/zip_flat.py "$SRC" "$ASSET"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.item }}'
          path: ${{ env.ASSET }}
          retention-days: 1

  build_media:
    runs-on: ubuntu-latest
    needs: setup
    env:
      ASSET: ${{ github.repository_owner }}.${{ github.event.repository.name }}.media.${{ github.ref_name }}.zip
    steps:
      - uses: actions/checkout@v4
      # Flat for the same reason: the pack unpacks straight into __lib__/media/<pack>/.
      - name: Archive media zip (flat, matching `sbs lib`)
        run: python .github/zip_flat.py media "$ASSET"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: media
          path: ${{ env.ASSET }}
          retention-days: 1

  build_release:
    runs-on: ubuntu-latest
    needs:
      - build_media
      - build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # allowUpdates + replacesArtifacts: re-pushing a tag rebuilds the same release
      # instead of creating a second one.
      - name: Upload binaries to release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "artifacts/*/*"
          tag: ${{ github.ref_name }}
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
